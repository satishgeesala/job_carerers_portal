
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted | Avalanche Careers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container text-center my-5">
        <div class="card shadow-sm mx-auto p-5" style="max-width: 600px;">

            <h1 class="text-success">Application Submitted!</h1>

            <p class="mt-3">
                Thank you for applying for
                <strong>{{ job.title }}</strong>.
            </p>

            <p>Your application has been received successfully.</p>

            <a href="{% url 'job_list' %}" class="btn btn-primary mt-3">
                Browse More Jobs
            </a>

        </div>
    </div>

</body>
</html>
