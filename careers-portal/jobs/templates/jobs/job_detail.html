
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ job.title }} | Avalanche Careers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Avalanche Careers
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <a href="{% url 'job_list' %}" class="btn btn-outline-secondary mb-4">
            &larr; Back to Jobs
        </a>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-3">{{ job.title }}</h2>

                <p class="text-muted">
                    {{ job.department }} |
                    {{ job.location }} |
                    {{ job.job_type }}
                </p>

                <hr>

                <h5>Job Description</h5>
                <p>{{ job.description|linebreaks }}</p>

                <h5 class="mt-4">Salary</h5>
                <p>{{ job.salary|default:"Not disclosed" }}</p>

                <h5 class="mt-4">Application Closing Date</h5>
                <p>{{ job.closing_date }}</p>
                
                <a href="{% url 'apply_job' job.slug %}"
                    class="btn btn-primary mt-3">
                    Apply Now
                </a>

            </div>
        </div>
    </div>

</body>
</html>
